name: Release Drafter Preview

on:
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-with-tag:
    name: Update Release Draft (With Tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          tag: ${{ github.ref_name }}

  update-release-draft:
    name: Update Release Draft
    if: !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
