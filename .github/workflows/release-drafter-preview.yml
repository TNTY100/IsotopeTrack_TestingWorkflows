name: Release Drafter Preview

on:
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          REPO_URL: ${{ github.repository }}
        with:
          config-name: release-drafter.yml
